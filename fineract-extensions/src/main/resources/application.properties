server.port=${EXTENSION_SERVER_PORT:9000}

# DB connection - reuse FINERACT env var names if available
spring.datasource.url=${FINERACT_HIKARI_JDBC_URL:jdbc:postgresql://postgresql:5432/fineract_tenants}
spring.datasource.username=${FINERACT_HIKARI_USERNAME:postgres}
spring.datasource.password=${FINERACT_HIKARI_PASSWORD:password}

# Keep default pool small for local dev
spring.datasource.initialization-mode=never
